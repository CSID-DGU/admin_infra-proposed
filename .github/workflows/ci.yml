name: CI

# PR과 main에 들어온 변경의 테스트를 돌린다. config-server 시험과 harness 시험은 가상 계층(메모리 대역)만
# 쓰고 DB·클러스터·NAS에 닿지 않는다.
# 공개 저장소라 로그에 인프라 주소·계정·설정값을 출력하는 단계를 두지 않는다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # E2E 사례 목록 검사(harness/test_e2e_catalog.py)가 admin_be의 신청 전이 표와 단위 시험 이름을 읽는다.
      - uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_be
          path: admin_be
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/main/resources/lifecycle-transitions.yaml
            src/test/java
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: config-server/requirements.txt
      - run: pip install -r config-server/requirements.txt pytest pyyaml
      - name: config-server
        run: python -m pytest -q config-server
      - name: harness
        working-directory: harness
        env:
          ADMIN_BE_DIR: ${{ github.workspace }}/admin_be
          E2E_REQUIRE_ADMIN_BE: "1"
        run: python -m pytest -q
