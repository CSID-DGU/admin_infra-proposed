# 공통 차트에는 운영 주소·계정·비밀값을 넣지 않는다. FARM/LAB별 값은 별도 values 파일에서 지정한다.
compatibility:
  # 기존 릴리스의 Deployment selector는 Kubernetes에서 변경할 수 없다. 기본값은 구 selector를
  # 그대로 유지해 제자리 upgrade를 안전하게 하고, 새 릴리스는 반드시 release로 덮어쓴다.
  deploymentSelectorMode: legacy

cluster:
  # 필수. 같은 코드와 차트를 여러 클러스터에 배포할 때 로그·상태·Admin BE 요청을 구분하는 식별자다.
  id: ""
  # 사용자 Pod가 /home으로 받을 노드 로컬 마운트 경로. {node}, {index} 치환을 지원한다.
  homeMountRootTemplate: ""
  ssh:
    user: ""
    keyPath: ""
    nodes: []
    secretName: ""
  adSsh:
    user: ""
    keyPath: ""
    nodes: []
    secretName: ""

image:
  repository: dguailab/config-server
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

resources:
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeralStorage: 1Gi
  limits:
    cpu: 2000m
    memory: 1024Mi

nfs:
  server: ""
  userSharePath: ""
  kubeSharePath: ""

nas:
  ssh:
    host: ""
    port: ""
    user: ""
    keyPath: ""
    secretName: ""

security:
  sudoAllowedCommands: ""

krb5:
  realm: ""
  kdcHosts: []
  adminServer: ""
  domain: ""

infra:
  adminBeInternalUrl: "http://admin-prod.default"
  slackSecretName: ""

monitoring:
  prometheusUrl: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"

accounts:
  uidMin: 20000
  uidMax: 0
  sharedGidMin: 70000
  sharedGidMax: 0
  prefix: ""

nodeport:
  min: 30000
  max: 32767

verifyMode: noprobe
faultInjection: false

imageStore:
  claimName: ""

config:
  namespace: ailab-infra

cleanup:
  image: config-server:latest

db:
  # FARM/LAB이 같은 MySQL을 쓰면 서로 다른 database/schema를 지정한다.
  host: "infra-mysql"
  port: 3306
  name: "pod_port_db"
  user: "pod_port_user"
  secretName: ""
  passwordKey: password

logDb:
  # 작업 제어·이력도 클러스터별 database/schema를 사용한다.
  host: "log-mysql"
  port: 3306
  name: "operation_state_db"
  user: "log_db_user"
  secretName: ""
  passwordKey: MYSQL_PASSWORD

redis:
  # 같은 Redis 인스턴스를 공유하면 FARM/LAB에 서로 다른 db 번호를 지정한다.
  host: redis-bg-master.ailab-infra.svc.cluster.local
  port: 6379
  db: 0

priorityClassName: ""

# 공통 기본값은 어느 노드에도 고정하지 않는다. FARM/LAB values에서 관리 데스크톱 라벨을 지정한다.
nodeSelector: {}
tolerations: []

controller:
  enabled: false
  pollSec: 2
  workers: 4

# 기존 FARM 배포 동작은 유지하되, 신규 LAB 릴리스는 각 주기 작업을 별도로
# 비활성화한 상태에서 health/read-only 검증부터 시작할 수 있어야 한다.
cronjobs:
  gpuCheck:
    enabled: true
  krb5Reconcile:
    enabled: true

apiToken:
  secretName: ""

sshKnownHosts:
  secretName: ""
