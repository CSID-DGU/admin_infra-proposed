# 공통 차트에는 운영 주소·계정·비밀값을 넣지 않는다. FARM/LAB별 값은 별도 values 파일에서 지정한다.
compatibility:
  # 기존 릴리스의 Deployment selector는 Kubernetes에서 변경할 수 없다. 기본값은 구 selector를
  # 그대로 유지해 제자리 upgrade를 안전하게 하고, 새 릴리스는 반드시 release로 덮어쓴다.
  deploymentSelectorMode: legacy

lab:
  # Phase 7-B의 Storage/Kerberos/NFS 연동과 lifecycle 쓰기 경로가 모두 준비되기 전에는
  # false를 유지한다. false인 LAB 릴리스는 차트가 API-only 계약을 통째로 검증하며,
  # 일부 의존성만 실수로 활성화한 values는 Helm 렌더 단계에서 거절한다.
  lifecycleDependenciesReady: false

cluster:
  # 필수. 같은 코드와 차트를 여러 클러스터에 배포할 때 로그·상태·Admin BE 요청을 구분하는 식별자다.
  id: ""
  # 사용자 Pod가 /home으로 받을 노드 로컬 마운트 경로. {node}, {index} 치환을 지원한다.
  homeMountRootTemplate: ""
  ssh:
    user: ""
    keyPath: ""
    nodes: []
    secretName: ""
  adSsh:
    user: ""
    keyPath: ""
    nodes: []
    secretName: ""

image:
  repository: dguailab/config-server
  tag: ""
  # 운영 배포는 가능하면 registry digest로 고정한다. 비어 있으면 기존 tag 경로를 유지한다.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

resources:
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeralStorage: 1Gi
  limits:
    cpu: 2000m
    memory: 1024Mi

nfs:
  server: ""
  userSharePath: ""
  kubeSharePath: ""

nas:
  ssh:
    host: ""
    port: ""
    user: ""
    keyPath: ""
    secretName: ""

security:
  sudoAllowedCommands: ""

krb5:
  realm: ""
  # Config Server의 AD 작업은 cluster.adSsh를 사용한다. Pod 안에서 직접 Kerberos client를
  # 써야 하는 배포에서만 지정하며, 비어 있으면 [realms] client 설정을 만들지 않는다.
  kdcHosts: []
  adminServer: ""
  domain: ""

infra:
  adminBeInternalUrl: "http://admin-prod.default"
  slackSecretName: ""

monitoring:
  prometheusUrl: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"

accounts:
  uidMin: 20000
  uidMax: 0
  sharedGidMin: 70000
  sharedGidMax: 0
  prefix: ""

nodeport:
  min: 30000
  max: 32767

verifyMode: noprobe
faultInjection: false

api:
  # 기존 FARM 동작을 유지하는 기본값이다. LAB API-bootstrap 배포는 반드시 true로
  # 덮어써 HTTP 쓰기 메서드와 Kubernetes 쓰기 RBAC를 함께 닫는다.
  readOnly: false
  # FARM controlled upgrade의 첫 revision에서만 true로 설정한다. API health는 유지하되
  # 새 쓰기 요청을 503으로 막고, controller=0/CronJob suspend와 함께 사용한다.
  maintenance: false

imageStore:
  claimName: ""

# 계정 원장(passwd/group/shadow)을 둘 /kube_share 볼륨. 기존 FARM은 아래 값을
# 비워 nfs.server/kubeSharePath를 그대로 사용한다. 전용 NFS export가 아직 없는
# 신규 클러스터는 별도 영속 PVC를 지정해 FARM 원장과 물리적으로 분리할 수 있다.
kubeShare:
  claimName: ""

config:
  namespace: ailab-infra

cleanup:
  image: config-server:latest

db:
  # FARM/LAB이 같은 MySQL을 쓰면 서로 다른 database/schema를 지정한다.
  host: "infra-mysql"
  port: 3306
  name: "pod_port_db"
  user: "pod_port_user"
  secretName: ""
  passwordKey: password

logDb:
  # 작업 제어·이력도 클러스터별 database/schema를 사용한다.
  host: "log-mysql"
  port: 3306
  name: "operation_state_db"
  user: "log_db_user"
  secretName: ""
  passwordKey: MYSQL_PASSWORD

redis:
  # 같은 Redis 인스턴스를 공유하면 FARM/LAB에 서로 다른 db 번호를 지정한다.
  host: redis-bg-master.ailab-infra.svc.cluster.local
  port: 6379
  db: 0

priorityClassName: ""

# 공통 기본값은 어느 노드에도 고정하지 않는다. FARM/LAB values에서 관리 데스크톱 라벨을 지정한다.
nodeSelector: {}
tolerations: []

controller:
  enabled: false
  replicas: 1
  pollSec: 2
  workers: 4

# 기존 FARM 배포 동작은 유지하되, 신규 LAB 릴리스는 각 주기 작업을 별도로
# 비활성화한 상태에서 health/read-only 검증부터 시작할 수 있어야 한다.
cronjobs:
  gpuCheck:
    enabled: true
    # FARM controlled upgrade 동안 Helm이 임시 suspend 상태를 소유하게 한다.
    suspend: false
  krb5Reconcile:
    enabled: true
    suspend: false

apiToken:
  secretName: ""

sshKnownHosts:
  secretName: ""
