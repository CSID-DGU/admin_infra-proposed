apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-krb5-reconcile
  namespace: {{ .Values.config.namespace }}
  labels:
    {{- include "containerssh-config-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: krb5-reconcile
    app: containerssh-config-server
spec:
  schedule: "*/30 * * * *"
  # 앞 실행이 끝나지 않았으면 새로 만들지 않고, 끝나지 않는 실행은 제한 시간에 끊는다. 둘 다 없으면
  # 마운트 실패처럼 영영 끝나지 않는 Pod가 주기마다 하나씩 쌓인다(2026-09-29 noprobe에서 7일간 123개).
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # 평소 수 초면 끝난다. 주기(30분)의 절반에서 끊어 다음 실행과 겹치지 않게 한다.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "containerssh-config-server.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: krb5-reconcile
            app: containerssh-config-server
        spec:
          serviceAccountName: {{ include "containerssh-config-server.serviceAccountName" . }}
          restartPolicy: OnFailure
          # 배포본(deployment.yaml)·제어기(controller.yaml)와 같은 관리 노드에 고정한다. 각 클러스터의
          # kube-share NFS에 닿는 nodeSelector는 FARM/LAB values가 따로 지정한다.
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: krb5-reconcile
              image: {{ include "containerssh-config-server.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "reconcile_krb5.py"]
              # 배포본과 같은 환경변수·볼륨을 쓴다. NAS SSH 키와 /kube_share(계정 대장)가
              # 있어야 reconcile_nas_gss_cache 가 공용 그룹 변경을 판정하고 캐시를 비운다(#153).
              env:
                {{- include "containerssh-config-server.env" . | nindent 16 }}
              volumeMounts:
                {{- include "containerssh-config-server.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "containerssh-config-server.volumes" . | nindent 12 }}
