apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-krb5-reconcile
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: containerssh-config-server
        spec:
          serviceAccountName: config-server
          restartPolicy: OnFailure
          containers:
            - name: krb5-reconcile
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "reconcile_krb5.py"]
              # 배포본과 같은 환경변수·볼륨을 쓴다. NAS SSH 키와 /kube_share(계정 대장)가
              # 있어야 reconcile_nas_gss_cache 가 공용 그룹 변경을 판정하고 캐시를 비운다(#153).
              env:
                {{- include "containerssh-config-server.env" . | nindent 16 }}
              volumeMounts:
                {{- include "containerssh-config-server.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "containerssh-config-server.volumes" . | nindent 12 }}
