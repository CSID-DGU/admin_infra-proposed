apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-krb5-reconcile
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: containerssh-config-server
        spec:
          serviceAccountName: config-server
          restartPolicy: OnFailure
          # 배포본(deployment.yaml)·제어기(controller.yaml)와 같은 노드에 고정한다. kube-share NFS가
          # csid-dgu-desktop에서만 닿아서(LAB·FARM 네트워크 분리), 이게 없으면 스케줄러가 임의의 farm
          # 노드에 올리고 거기서 mount.nfs가 실패한다(2026-09-22 발견 — #158이 이 CronJob에 kube-share
          # 마운트를 새로 추가하면서 이 블록을 같이 안 옮겨서 생긴 회귀).
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: krb5-reconcile
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "reconcile_krb5.py"]
              # 배포본과 같은 환경변수·볼륨을 쓴다. NAS SSH 키와 /kube_share(계정 대장)가
              # 있어야 reconcile_nas_gss_cache 가 공용 그룹 변경을 판정하고 캐시를 비운다(#153).
              env:
                {{- include "containerssh-config-server.env" . | nindent 16 }}
              volumeMounts:
                {{- include "containerssh-config-server.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "containerssh-config-server.volumes" . | nindent 12 }}
