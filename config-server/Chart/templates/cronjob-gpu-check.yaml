apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-gpu-check
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
spec:
  # GPU 유실은 발견이 늦어질수록 사용자가 오래 방치되므로 krb5-reconcile(30분)보다 짧게 잡는다.
  schedule: "*/10 * * * *"
  # 앞 실행이 끝나지 않았으면 새로 만들지 않고, 끝나지 않는 실행은 제한 시간에 끊는다. 둘 다 없으면
  # 마운트 실패처럼 영영 끝나지 않는 Pod가 주기마다 하나씩 쌓인다(2026-09-29 noprobe에서 7일간 123개).
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # 평소 수 초면 끝난다. 주기(10분)의 절반에서 끊어 다음 실행과 겹치지 않게 한다.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: containerssh-config-server
        spec:
          serviceAccountName: config-server
          restartPolicy: OnFailure
          containers:
            - name: gpu-check
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "check_gpu_pods.py"]
              env:
                - name: NAMESPACE
                  value: "{{ .Values.config.namespace }}"
                - name: ADMIN_BE_INTERNAL_URL
                  value: "{{ .Values.infra.adminBeInternalUrl }}"
                # admin_be /api/internal/** 호출에 필요한 내부 API 토큰
                - name: CONFIG_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.apiToken.secretName }}"
                      key: token
                - name: INFRA_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: config-server-infra-slack-secret
                      key: webhookUrl
                      optional: true
