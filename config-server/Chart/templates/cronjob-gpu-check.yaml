{{- if .Values.cronjobs.gpuCheck.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-gpu-check
  namespace: {{ .Values.config.namespace }}
  labels:
    {{- include "containerssh-config-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-check
    app: containerssh-config-server
spec:
  suspend: {{ .Values.cronjobs.gpuCheck.suspend }}
  # GPU 유실은 발견이 늦어질수록 사용자가 오래 방치되므로 krb5-reconcile(30분)보다 짧게 잡는다.
  schedule: "*/10 * * * *"
  # 앞 실행이 끝나지 않았으면 새로 만들지 않고, 끝나지 않는 실행은 제한 시간에 끊는다. 둘 다 없으면
  # 마운트 실패처럼 영영 끝나지 않는 Pod가 주기마다 하나씩 쌓인다(2026-09-29 noprobe에서 7일간 123개).
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # 평소 수 초면 끝난다. 주기(10분)의 절반에서 끊어 다음 실행과 겹치지 않게 한다.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "containerssh-config-server.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: gpu-check
            app: containerssh-config-server
        spec:
          serviceAccountName: {{ include "containerssh-config-server.serviceAccountName" . }}
          restartPolicy: OnFailure
          # API·제어기 및 krb5-reconcile과 같은 클러스터 관리 데스크톱에서 실행한다.
          # 클러스터별 nodeSelector/toleration은 FARM/LAB values가 각각 지정한다.
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: gpu-check
              image: {{ include "containerssh-config-server.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "check_gpu_pods.py"]
              env:
                - name: CLUSTER_ID
                  value: {{ include "containerssh-config-server.clusterId" . | quote }}
                - name: KUBERNETES_CLIENT_MODE
                  value: "in-cluster"
                - name: KUBERNETES_CLIENT_VALIDATE_AT_STARTUP
                  value: "true"
                - name: NAMESPACE
                  value: "{{ .Values.config.namespace }}"
                # GPU 유실 때 노드 커널 로그를 읽는 일회용 Pod에 쓰는 이미지(이 크론잡과 같은 이미지)
                - name: IMAGE_HELPER_IMAGE
                  value: {{ include "containerssh-config-server.image" . | quote }}
                # 재부팅 보고의 노드 SSH 점검이 노드별 sshd 포트를 찾는 데 쓴다(없으면 "확인 불가"로 보고한다)
                - name: INFRA_NODES_JSON
                  value: {{ .Values.cluster.ssh.nodes | toJson | quote }}
                - name: GPU_CHECK_STATE_NAME
                  value: {{ include "containerssh-config-server.gpuStateConfigMapName" . | quote }}
                - name: ADMIN_BE_INTERNAL_URL
                  value: "{{ .Values.infra.adminBeInternalUrl }}"
                # admin_be /api/internal/** 호출에 필요한 내부 API 토큰
                - name: CONFIG_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "containerssh-config-server.apiTokenSecretName" . | quote }}
                      key: token
                - name: INFRA_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "containerssh-config-server.slackSecretName" . | quote }}
                      key: webhookUrl
                      optional: true
{{- end }}
