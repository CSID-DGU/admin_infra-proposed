apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: containerssh-config-server
  template:
    metadata:
      labels:
        app: containerssh-config-server
        # Service는 이 라벨까지 본다. 크론잡 Pod도 app 라벨이 같아(DB·Redis 접근 허용 규칙이 그 라벨을 쓴다)
        # app만 보면 크론잡 Pod가 떠 있는 동안 요청 일부가 포트를 열지 않은 그 Pod로 가서 거절된다.
        component: api
    spec:
      # 배포 롤링 업데이트가 진행 중인 요청(/delete-pod·/migrate 등, 최대 POD_READY_MAX_WAIT_SEC=500초
      # + 전후 단계)을 SIGTERM으로 끊지 않도록 gunicorn --graceful-timeout보다 여유 있게 잡는다.
      # 기본값 30초로는 롤링 업데이트 때마다 진행 중인 Pod 생성이 중간에 끊겨 계정만 삭제되고
      # k8s Pod는 고아로 남는 문제가 있었다.
      terminationGracePeriodSeconds: 630
      serviceAccountName: config-server
      {{- with .Values.priorityClassName }}{{/* 등급을 만들어 둔 환경에서만 지정한다 */}}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}{{/* nodeSelector 설정이 있으면 적용 */}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "containerssh-config-server.env" . | nindent 12 }}
          # 뜨는 동안에는 2초마다 확인해 준비되는 즉시 넘어간다(최대 2분). 뜬 뒤의 확인 주기는 그대로다.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
              {{- with .Values.resources.requests.ephemeralStorage }}
              ephemeral-storage: {{ . }}
              {{- end }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            {{- include "containerssh-config-server.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "containerssh-config-server.volumes" . | nindent 8 }}
