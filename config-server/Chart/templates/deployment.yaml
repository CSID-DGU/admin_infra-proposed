apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: containerssh-config-server
  template:
    metadata:
      labels:
        app: containerssh-config-server
    spec:
      # 배포 롤링 업데이트가 진행 중인 요청(/delete-pod·/migrate 등, 최대 POD_READY_MAX_WAIT_SEC=500초
      # + 전후 단계)을 SIGTERM으로 끊지 않도록 gunicorn --graceful-timeout보다 여유 있게 잡는다.
      # 기본값 30초로는 롤링 업데이트 때마다 진행 중인 Pod 생성이 중간에 끊겨 계정만 삭제되고
      # k8s Pod는 고아로 남는 문제가 있었다.
      terminationGracePeriodSeconds: 630
      serviceAccountName: config-server
      {{- with .Values.nodeSelector }}{{/* nodeSelector 설정이 있으면 적용 */}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "containerssh-config-server.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            {{- include "containerssh-config-server.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "containerssh-config-server.volumes" . | nindent 8 }}
