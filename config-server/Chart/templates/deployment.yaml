apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}
  namespace: {{ .Values.config.namespace }}
  labels:
    {{- include "containerssh-config-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    app: containerssh-config-server
spec:
  replicas: 1
  # legacy 모드는 apps/v1 Deployment에서 변경할 수 없는 기존 운영 selector를 정확히 유지한다.
  selector:
    matchLabels:
      {{- if eq (include "containerssh-config-server.selectorMode" .) "legacy" }}
      app: containerssh-config-server
      {{- else }}
      {{- include "containerssh-config-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "containerssh-config-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        # 기존 NetworkPolicy·운영 점검 스크립트가 이 라벨로 API Pod를 찾는다.
        app: containerssh-config-server
        component: api
    spec:
      # 배포 롤링 업데이트가 진행 중인 요청(/delete-pod·/migrate 등, 최대 POD_READY_MAX_WAIT_SEC=500초
      # + 전후 단계)을 SIGTERM으로 끊지 않도록 gunicorn --graceful-timeout보다 여유 있게 잡는다.
      # 기본값 30초로는 롤링 업데이트 때마다 진행 중인 Pod 생성이 중간에 끊겨 계정만 삭제되고
      # k8s Pod는 고아로 남는 문제가 있었다.
      terminationGracePeriodSeconds: 630
      serviceAccountName: {{ include "containerssh-config-server.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}{{/* 등급을 만들어 둔 환경에서만 지정한다 */}}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}{{/* nodeSelector 설정이 있으면 적용 */}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-server
          image: {{ include "containerssh-config-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "containerssh-config-server.env" . | nindent 12 }}
          # 뜨는 동안에는 2초마다 확인해 준비되는 즉시 넘어간다(최대 2분). 뜬 뒤의 확인 주기는 그대로다.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
              {{- with .Values.resources.requests.ephemeralStorage }}
              ephemeral-storage: {{ . }}
              {{- end }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            {{- include "containerssh-config-server.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "containerssh-config-server.volumes" . | nindent 8 }}
