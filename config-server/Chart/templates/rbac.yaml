apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-server-role
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "services"]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete", "patch", "update"]
# Pod 생성 진행 단계(get_pod_progress_stage)를 이벤트에서 읽기 위해 필요 — 없으면
# 매 폴링마다 403으로 실패해 이미지 pull/컨테이너 기동 세부 단계 없이 generic 메시지로만 표시된다
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# krb5 keytab Secret(krb5-keytab-<user>) 생성/조회/삭제 — #82 KRB5 계정 연동
- apiGroups: [""]
  resources: ["secrets"]
  # patch: 계정 Secret의 소유자를 Pod로 지정해 Pod가 어떤 경로로 사라져도 Secret이 함께 지워지게 한다.
  # 이 권한이 없어 그 지정이 매번 403으로 거부되고 경고만 남고 있었다.
  # list는 쓰지 않는다 — 코드는 이름을 알고 하나씩 읽는다(read_namespaced_secret).
  verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-server-rolebinding
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
subjects:
- kind: ServiceAccount
  name: config-server
  namespace: {{ .Values.config.namespace }}
roleRef:
  kind: Role
  name: config-server-role
  apiGroup: rbac.authorization.k8s.io
---
# nodes는 cluster-scoped — resolve_k8s_node_name() 등에서 list/get node 필요
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader
  labels:
    app: containerssh-config-server
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader-binding
  labels:
    app: containerssh-config-server
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: {{ .Values.config.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader
  apiGroup: rbac.authorization.k8s.io
---
# services는 네임스페이스 전역에서 list 필요 — 기존 Role은 config-server 자신의
# namespace로 한정되어 다른 namespace의 서비스 조회 시 403 발생
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader
  labels:
    app: containerssh-config-server
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader-binding
  labels:
    app: containerssh-config-server
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: {{ .Values.config.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader
  apiGroup: rbac.authorization.k8s.io
