{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-controller
  namespace: {{ .Values.config.namespace }}
  labels:
    {{- include "containerssh-config-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    app: containerssh-config-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  # 제어기 두 벌이 동시에 뜨면 같은 작업을 두 번 실행한다. RollingUpdate 금지 — 이전 Pod가 완전히
  # 내려간 뒤에야 새 Pod를 띄운다.
  strategy:
    type: Recreate
  # legacy 모드는 기존 controller Deployment의 immutable selector를 정확히 유지한다.
  selector:
    matchLabels:
      {{- if eq (include "containerssh-config-server.selectorMode" .) "legacy" }}
      app: containerssh-config-controller
      {{- else }}
      {{- include "containerssh-config-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "containerssh-config-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        # 기존 DB·Redis·Admin BE NetworkPolicy가 이 라벨로 제어기를 허용한다.
        app: containerssh-config-controller
    spec:
      # 제어기는 SIGTERM을 받으면 새 작업을 더 받지 않고, 실행 중인 작업(Pod 생성은 최대
      # POD_READY_MAX_WAIT_SEC=500초)이 끝날 때까지 기다린다.
      terminationGracePeriodSeconds: 630
      serviceAccountName: {{ include "containerssh-config-server.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "containerssh-config-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "controller.py"]
          env:
            {{- include "containerssh-config-server.env" . | nindent 12 }}
            - name: CONTROLLER_POLL_SEC
              value: "{{ .Values.controller.pollSec }}"
            - name: CONTROLLER_WORKERS
              value: "{{ .Values.controller.workers }}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
              {{- with .Values.resources.requests.ephemeralStorage }}
              ephemeral-storage: {{ . }}
              {{- end }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            {{- include "containerssh-config-server.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "containerssh-config-server.volumes" . | nindent 8 }}
{{- end }}
