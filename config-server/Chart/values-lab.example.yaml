# 예시 전용 값이다. 문서용 TEST-NET 주소와 REPLACE_* 표시는 배포 전에 LAB 운영값으로 바꾼다.
compatibility:
  # 신규 릴리스용. 구 운영 Deployment를 제자리 upgrade할 때는 legacy를 유지한다.
  deploymentSelectorMode: release

lab:
  # Storage/Kerberos/NFS와 lifecycle 쓰기 경로를 검증하는 Phase 7-B가 끝나기 전에는
  # 반드시 false다. true 전환은 아래 API-only 잠금값을 운영값으로 한 번에 교체하는
  # 별도 Phase 7-B 변경으로만 수행한다.
  lifecycleDependenciesReady: false

cluster:
  id: lab
  homeMountRootTemplate: ""
  ssh:
    user: disabled-until-phase7b
    keyPath: ""
    nodes:
      - name: lab1
        host: 198.51.100.11
        port: 22
  adSsh:
    user: disabled-until-phase7b
    keyPath: ""
    nodes: []

image:
  tag: REPLACE_WITH_IMMUTABLE_IMAGE_TAG
  # 운영 workflow가 검증한 sha256 digest를 주입한다. 수동 예시에서는 비워 둔다.
  digest: ""

# Storage/Kerberos/NFS/Admin BE 쓰기 연동 전의 API-bootstrap 안전장치다.
# HTTP 쓰기 메서드를 거절하고 차트 RBAC도 조회 전용으로 축소한다.
api:
  readOnly: true

# pfSense의 LAB 전용 전달 구간과 일치시킨다. 30000~30079는 FARM 사용자,
# 30080~30099는 관리·인프라 예외용으로 남기므로 LAB 사용자 Service에는 배정하지 않는다.
nodeport:
  min: 30100
  max: 32767

nfs:
  server: ""
  userSharePath: ""
  kubeSharePath: ""

nas:
  ssh:
    host: ""
    port: ""
    user: disabled-until-phase7b
    keyPath: ""

krb5:
  realm: ""
  kdcHosts: []
  adminServer: ""
  domain: ""

infra:
  # callback을 실서비스로 보내지 않는 discard sink다.
  adminBeInternalUrl: http://127.0.0.1:9

monitoring:
  # Phase 7-B 전에는 외부 모니터링 의존성을 열지 않는다.
  prometheusUrl: http://127.0.0.1:9

imageStore:
  claimName: REPLACE_WITH_LAB_IMAGE_STORE_PVC

# LAB 계정 원장은 FARM NFS 경로를 복사하지 않는다. LAB 전용 NFS export가
# 준비되지 않은 초기 배포에서는 LAB-MGMT 로컬 Retain PVC를 사용할 수 있다.
kubeShare:
  claimName: REPLACE_WITH_LAB_KUBE_SHARE_PVC

db:
  host: REPLACE_WITH_LAB_DB_HOST
  name: REPLACE_WITH_LAB_LEDGER_DB
  user: REPLACE_WITH_LAB_DB_USER

logDb:
  host: REPLACE_WITH_LAB_LOG_DB_HOST
  name: REPLACE_WITH_LAB_LOG_DB
  user: REPLACE_WITH_LAB_LOG_DB_USER

redis:
  host: REPLACE_WITH_LAB_REDIS_HOST
  db: 0

# 최초 LAB 배포는 API health와 read-only 경로만 검증한다. controller와
# 주기 작업은 각각 별도 검토를 마친 뒤 한 종류씩 활성화한다.
controller:
  enabled: false

cronjobs:
  gpuCheck:
    enabled: false
  krb5Reconcile:
    enabled: false

nodeSelector:
  provi.dgu.ac.kr/role: lab-management
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
