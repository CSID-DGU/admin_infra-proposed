# 스택 전용 프론트엔드. 이미지는 워크플로가 admin_fe 소스의 nginx.conf에서 /api/와 /pod-status/
# 대상만 이 스택의 admin_be·config-server로 바꿔 빌드한 것이다(운영 프론트엔드와 코드는 같음).
# 밖에서는 운영 프론트엔드와 같은 ingress 컨트롤러(nodePort 30081)로 들어오고, 호스트 이름으로 스택을 가른다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailab-frontend
  namespace: __NS__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ailab-frontend
  template:
    metadata:
      labels:
        app: ailab-frontend
    spec:
      priorityClassName: ailab-stack-component
      automountServiceAccountToken: false
      containers:
        - name: ailab-frontend
          image: __FE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ailab-frontend
  namespace: __NS__
spec:
  selector:
    app: ailab-frontend
  ports:
    - port: 80
      targetPort: 80
---
# 운영 프론트엔드 ingress(ailab-frontend/ailab-frontend)와 같은 설정. 운영 규칙은 모든 호스트를 받지만,
# ingress-nginx는 호스트가 정확히 일치하는 규칙을 먼저 적용하므로 운영 화면에는 영향이 없다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ailab-frontend
  namespace: __NS__
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 타임아웃 체인: config-server(500s) < admin_be(550s) < 여기(570s) < 프론트(600s).
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "570"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "570"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "570"
spec:
  ingressClassName: nginx-ailab
  rules:
    - host: __FE_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ailab-frontend
                port:
                  number: 80
