# config-server용(인증 없음, 운영 redis-bg와 같은 이름)과 admin_be용(비밀번호 있음, 운영 my-redis와 같은 방식)
# 두 대. 둘 다 재시작에도 데이터가 남아야 한다 — admin-redis에는 Slack 알림 대기열·이메일 인증
# 코드가 쌓이는데, 재시작 한 번에 통째로 사라지면 실사용자가 인증 메일을 다시 받아야 하거나
# 관리자 알림이 조용히 유실된다(2026-09-18 실운영 점검 중 지적). AOF+RDB로 영속화한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-bg-master
  namespace: __NS__
spec:
  replicas: 1
  # RWO PVC는 한 Pod만 마운트할 수 있어, 새 Pod가 뜨기 전에 옛 Pod가 완전히 내려가야 한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-bg
  template:
    metadata:
      labels:
        app: redis-bg
    spec:
      priorityClassName: ailab-stack-component
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--aof-use-rdb-preamble", "yes", "--appendfsync", "everysec"]
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-bg-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-bg-data
  namespace: __NS__
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-bg-master
  namespace: __NS__
spec:
  selector:
    app: redis-bg
  ports:
    - port: 6379
---
# config-server 본체와 제어기만 이 대기열에 닿을 필요가 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-bg-ingress
  namespace: __NS__
spec:
  podSelector:
    matchLabels:
      app: redis-bg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: containerssh-config-server
        - podSelector:
            matchLabels:
              app: containerssh-config-controller
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-redis
  namespace: __NS__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admin-redis
  template:
    metadata:
      labels:
        app: admin-redis
    spec:
      priorityClassName: ailab-stack-component
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --aof-use-rdb-preamble yes --appendfsync everysec"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stack-db
                  key: admin_redis
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: admin-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: admin-redis-data
  namespace: __NS__
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-redis
  namespace: __NS__
spec:
  selector:
    app: admin-redis
  ports:
    - port: 6379
---
# admin_be만 이 인스턴스(세션·알림 대기열·인증 코드)에 닿을 필요가 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-redis-ingress
  namespace: __NS__
spec:
  podSelector:
    matchLabels:
      app: admin-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: admin-prod
      ports:
        - protocol: TCP
          port: 6379
