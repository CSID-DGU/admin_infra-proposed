# 스택별 UID·NodePort 대역 선언. stack-up.sh는 case문에 값을 하드코딩하는 대신 이 파일을 읽고,
# 배포 전에 자기 대역이 다른 스택 대역과 겹치면 그 자리에서 막는다(git 파일끼리 비교하므로 형제
# 스택이 지금 떠 있는지와 무관하게 검사할 수 있다). 새 스택을 추가하거나 대역을 바꿀 때는 여기만
# 고치면 된다 — case문 주석에 손으로 적지 않는다. (admin_infra-proposed#118)
#
# 실제로 겪은 충돌 사고들:
# - operation 추가 때 UID_MAX=99999로 잡았다가 noprobe/full/baseline(50000~64999)과 겹칠 뻔함
#   (리뷰 중 발견, 배포 전 수정)
# - 구 운영 실계정이 20000~20017에 몰려 있어(직접 조회로 확인) UID_MIN=20000도 충돌
# - NodePort 33000~34999로 잡았는데 이 클러스터 쿠버네티스 API 서버의 실제 허용 범위가
#   기본값인 30000~32767뿐이라 그 밖의 값은 서비스 생성이 422로 거부됨(2026-09-18 e2e 점검 중 발견)
# - 공용 그룹 gid를 uid와 같은 할당기·같은 대역에서 뽑아 운영 원장에 testgroup:21003 이 생겼고,
#   다음 배정될 uid도 21003이었다. 그 상태로 계정 하나만 더 승인했으면 그 사용자의 primary 그룹이
#   testgroup이 됐다(2026-09-21 운영 원장 실조회로 발견, #148 — 공용 gid 대역 분리로 수정)
# - operation 대역을 30500~31999로 잡았는데 pfSense가 외부로 여는 구간은 30000~30097뿐이라
#   (210.94.179.19:9300-9397 → farm6:30000-30097) 안내한 주소로 접속이 되지 않음. admin_be의
#   toFarmPublicPort도 offset<98일 때만 공인 포트로 바꾸므로 변환 없이 NodePort 번호가 그대로
#   안내됐다. 내부는 정상이라 실패가 드러나지 않는다(2026-09-19 외부망 실측으로 확인)
#
# 필드:
#   uid_min/uid_max       — Linux/AD 계정 UID 대역. 실제 계정은 같은 farm 노드 OS에 만들어지므로
#                            스택마다 원장이 격리돼 있어도 겹치면 안 된다. 개인 그룹은 gid=uid이므로
#                            이 대역은 개인 그룹 gid 대역이기도 하다.
#   shared_gid_min/max     — 공용(팀) 그룹 gid 대역. uid 대역과 떼어 놓는다 — 한 대역을 두 할당기가
#                            나눠 쓰면 공용 그룹이 다음 uid 번호를 선점해 그 계정의 primary 그룹이
#                            남의 팀 그룹이 된다. AD·NAS 공유는 uid와 같으므로 스택별로도 나눈다.
#                            전 구간이 farm smb.conf 의 idmap range(1000-299999) 안이어야 한다.
#   np_min/np_max          — 사용자 컨테이너 NodePort 대역. 반드시 30000~32767 안이어야 하고
#                            (이 클러스터 쿠버네티스 API 서버의 실제 허용 범위), 사용자가 외부에서
#                            접속해야 하는 스택은 pfSense 개방 구간 30000~30097 안이어야 한다.
#                            실험 스택은 외부 접속을 쓰지 않으므로 32000번대를 그대로 둔다.
#   config_nodeport         — config-server 자신의 NodePort. 구 운영이 30082/30083을 쥐고 있어
#                            (Pod가 내려가 있어도 Service는 nodePort를 해제하지 않는다) 못 쓴다.
#                            admin_be가 클러스터 안에서 ClusterIP로 부르므로 외부 개방 구간 밖이어도 된다.
#   prefix                  — 계정 이름 접두어. 실험 스택은 실제 계정과 안 섞이도록 접두어를 강제한다.
#                            실운영은 접두어 없이("") 실사용자가 원하는 이름을 그대로 쓴다.
#
# operation의 30000~30079는 pfSense 개방 구간(30000~30097)에서 인프라 고정 포트(30080~30083)를
# 뺀 앞자락이다. 내려간 구 운영(ailab-infra)의 시험 계정 Service 23개가 이 구간을 물고 있었는데,
# 엔드포인트가 하나도 없고 참조하는 Pod도 모두 사라진 것을 확인한 뒤 2026-09-19에 회수했다.
# 아직 남아 있는 구 운영 Service(30021~30030, 30033, 30034)와 인프라 고정 포트는 config-server의
# get_cluster_reserved_nodeports()가 클러스터를 실조회해 자동으로 건너뛰므로 여기서 뺄 필요가 없다.
- {stack: baseline,  uid_min: 60000, uid_max: 64999, shared_gid_min: 90000, shared_gid_max: 94999, np_min: 32500, np_max: 32749, config_nodeport: 30382, prefix: "exp-bl-"}
- {stack: noprobe,   uid_min: 50000, uid_max: 54999, shared_gid_min: 80000, shared_gid_max: 84999, np_min: 32000, np_max: 32249, config_nodeport: 30182, prefix: "exp-np-"}
- {stack: full,      uid_min: 55000, uid_max: 59999, shared_gid_min: 85000, shared_gid_max: 89999, np_min: 32250, np_max: 32499, config_nodeport: 30282, prefix: "exp-fu-"}
- {stack: operation, uid_min: 21000, uid_max: 49999, shared_gid_min: 70000, shared_gid_max: 79999, np_min: 30000, np_max: 30079, config_nodeport: 30482, prefix: ""}
