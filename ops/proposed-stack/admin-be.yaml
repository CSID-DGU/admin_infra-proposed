# 운영 admin_be 이미지를 그대로 쓰고 설정만 덮어쓴다(admin-be-config 시크릿의 SPRING_APPLICATION_JSON).
# config-server가 Pod를 만들 때 사용자 설정을 여기서 조회하므로 스택마다 한 대가 필요하다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-prod
  namespace: __NS__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-prod
  template:
    metadata:
      labels:
        app: admin-prod
      annotations:
        # 설정 시크릿이 바뀌면 다시 뜨도록
        ailab.dgu/config-hash: "__CONFIG_HASH__"
    spec:
      # 디스크가 쪼들리는 노드에 걸리면 등급 없는 Pod부터 밀려난다. 백엔드가 밀려나면 스택 전체가
      # 멈추므로 사용자 컨테이너보다 한 단계 위 등급을 준다(stack-up.sh에서 만든다).
      priorityClassName: ailab-stack-component
      # 관리자 컨테이너 관리 화면이 Pod 상세·로그·이벤트를 쿠버네티스 API로 직접 읽는다. 권한은 아래 Role로
      # 이 스택 네임스페이스 안 읽기만 준다.
      serviceAccountName: admin-prod
      automountServiceAccountToken: true
      containers:
        - name: admin-prod
          image: __ADMIN_IMAGE__
          args: ["--spring.profiles.active=prod"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: admin-be-config
          env:
            - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
              value: "-1"
          # 운영과 같은 설정 파일(admin-prod-config 복사본). Spring Boot는 ./config/를 jar 안 설정보다 우선한다.
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          # readiness보다 한참 느긋하게 잡는다 — 뜨는 중에 liveness가 먼저 죽이면 안 된다.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: app-config
          secret:
            secretName: admin-prod-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-prod
  namespace: __NS__
---
# 운영 admin_be의 admin-prod-pod-reader와 같은 권한이지만 이 스택 네임스페이스에만 준다.
# 운영 네임스페이스(ailab-infra)의 Pod는 읽을 수 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-prod-pod-reader
  namespace: __NS__
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-prod-pod-reader
  namespace: __NS__
subjects:
  - kind: ServiceAccount
    name: admin-prod
    namespace: __NS__
roleRef:
  kind: Role
  name: admin-prod-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: admin-prod
  namespace: __NS__
spec:
  selector:
    app: admin-prod
  ports:
    - port: 80
      targetPort: 8080
---
# 운영 이미지 안에는 운영 DB·config-server·Slack·메일 주소가 들어 있다. 덮어쓰기에서 하나라도 빠지면
# 실험 admin_be가 운영에 닿을 수 있으므로, 같은 네임스페이스와 DNS 외의 모든 나가는 연결을 막는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-prod-egress
  namespace: __NS__
spec:
  podSelector:
    matchLabels:
      app: admin-prod
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 가입 인증 메일(Gmail SMTP)만 밖으로 허용한다. Slack(443) 등 다른 외부 연결은 막는다.
    - ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
    # 쿠버네티스 API(관리자 화면의 Pod 조회). 주소는 설치 스크립트가 클러스터에서 읽어 넣는다 — 서비스
    # 주소로 들어간 연결은 실제 API 서버 주소로 바뀐 뒤 정책에 걸리므로 둘 다 넣는다.
__API_EGRESS__
