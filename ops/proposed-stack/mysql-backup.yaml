# 스택 DB를 매일 한 번 통째로 떠서 DB와 다른 노드의 디스크에 둔다. DB 데이터는 한 노드의 로컬 디스크에만
# 있어, 그 디스크가 고장 나거나 저장소 요청(PVC)을 잘못 지우면 되살릴 사본이 없다.
# 덤프에는 사용자 정보가 들어 있다. 읽기 전용 계정으로 앱 DB 세 개만 뜨고(DB 계정 정보인 mysql 스키마는
# 뜨지 않는다 — 계정은 stack-up.sh가 다시 만든다), 파일과 폴더는 root만 읽게 둔다.
# NAS에 두지 않는 이유: 이 클러스터의 NFS 저장소 종류로는 NAS가 붙지 않는다(2026-10-08 실측, 연결 시간 초과).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backup
  namespace: __NS__
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: __NS__
spec:
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul
  # 앞 작업이 안 끝났으면 건너뛴다. 놓친 시각은 한 시간 안에서만 뒤늦게 돈다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: stack-mysql-backup
        spec:
          restartPolicy: Never
          priorityClassName: ailab-stack-component
          # DB(farm2)와 다른 노드에 둔다. 같은 노드면 그 디스크가 죽을 때 사본도 같이 사라진다.
          nodeSelector:
            kubernetes.io/hostname: __BACKUP_NODE__
          containers:
            - name: backup
              image: mysql:8.0.36
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: stack-db
                      key: backup_user
                - name: KEEP_DAYS
                  value: "14"
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  umask 077
                  chmod 700 /backup
                  out="/backup/$(date +%Y%m%d-%H%M%S).sql.gz"
                  # 끝까지 쓴 파일만 제 이름을 갖는다. 중간에 끊긴 덤프가 정상 사본처럼 남지 않게 한다.
                  mysqldump -h infra-mysql -ubackup_user --single-transaction --no-tablespaces \
                    --routines --triggers --events \
                    --databases pod_port_db operation_state_db web_admin | gzip > "$out.part"
                  gzip -t "$out.part"
                  zcat "$out.part" | tail -n 1 | grep -q "Dump completed"
                  mv "$out.part" "$out"
                  find /backup -maxdepth 1 -name "*.sql.gz" -mtime "+$KEEP_DAYS" -delete
                  find /backup -maxdepth 1 -name "*.part" -mmin +120 -delete
                  echo "backup ok: $(basename "$out") $(du -h "$out" | cut -f1), kept $(ls /backup/*.sql.gz | wc -l) files"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mysql-backup
